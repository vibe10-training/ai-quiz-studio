<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 퀴즈 스튜디오 — 문제 출제 &amp; 갤러리</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <div class="brand" role="button" tabindex="0" id="brand-home">
        <span class="brand-icon">Q</span>
        <div>
          <h1 class="brand-title">AI 퀴즈 스튜디오</h1>
          <p class="brand-sub">과목 · 단원 맞춤형 문제 출제 &amp; 해설</p>
        </div>
      </div>

      <nav class="nav-tabs" aria-label="메인 메뉴">
        <button type="button" class="nav-tab active" data-tab="generator" id="tab-generator">
          문제 출제
        </button>
        <button type="button" class="nav-tab" data-tab="gallery" id="tab-gallery">
          갤러리 <span class="badge" id="gallery-count-badge">0</span>
        </button>
      </nav>

      <div class="status-pill" id="ai-status-pill" title="서버 AI 설정 상태">
        <span class="status-dot"></span>
        <span id="ai-status-text">상태 확인 중...</span>
      </div>
    </div>
  </header>

  <main class="container main-content">
    <!-- ==================== 문제 출제 탭 ==================== -->
    <section id="view-generator" class="tab-view active">
      <div class="card form-card">
        <div class="card-header">
          <h2>새 퀴즈 출제하기</h2>
          <p class="muted">과목명과 단원명을 입력하면 AI가 문제와 상세 해설을 생성합니다.</p>
        </div>

        <div class="quick-presets">
          <span class="preset-label">빠른 예시:</span>
          <button type="button" class="preset-chip" data-subject="수학" data-unit="이차방정식">수학 · 이차방정식</button>
          <button type="button" class="preset-chip" data-subject="과학" data-unit="광합성과 호흡">과학 · 광합성과 호흡</button>
          <button type="button" class="preset-chip" data-subject="정보" data-unit="인공지능과 머신러닝">정보 · 인공지능과 머신러닝</button>
          <button type="button" class="preset-chip" data-subject="한국사" data-unit="삼국시대의 문화">한국사 · 삼국시대의 문화</button>
        </div>

        <form id="quiz-form" class="quiz-form" novalidate>
          <div class="form-grid">
            <div class="form-group">
              <label for="input-subject">과목명 <span class="required">*</span></label>
              <input type="text" id="input-subject" name="subject" placeholder="예: 수학, 과학, 정보, 영어" required maxlength="100" />
            </div>

            <div class="form-group">
              <label for="input-unit">단원명 <span class="required">*</span></label>
              <input type="text" id="input-unit" name="unit" placeholder="예: 이차방정식, 광합성" required maxlength="150" />
            </div>
          </div>

          <div class="form-grid form-grid-3">
            <div class="form-group">
              <label>문제 유형</label>
              <div class="segmented" role="radiogroup" aria-label="문제 유형">
                <label class="seg-option">
                  <input type="radio" name="question_type" value="multiple_choice" checked />
                  <span>객관식</span>
                </label>
                <label class="seg-option">
                  <input type="radio" name="question_type" value="short_answer" />
                  <span>주관식</span>
                </label>
              </div>
            </div>

            <div class="form-group">
              <label for="input-count">문항 수</label>
              <select id="input-count" name="count">
                <option value="3">3문항</option>
                <option value="5" selected>5문항</option>
                <option value="7">7문항</option>
                <option value="10">10문항</option>
              </select>
            </div>

            <div class="form-group">
              <label for="input-difficulty">난이도</label>
              <select id="input-difficulty" name="difficulty">
                <option value="easy">쉬움</option>
                <option value="medium" selected>보통</option>
                <option value="hard">어려움</option>
              </select>
            </div>
          </div>

          <div id="form-error" class="alert alert-error hidden" role="alert"></div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="btn-generate">
              <span class="btn-text">퀴즈 생성하기</span>
            </button>
          </div>
        </form>
      </div>

      <!-- 로딩 상태 -->
      <div id="loading-box" class="card loading-card hidden">
        <div class="spinner" aria-hidden="true"></div>
        <p class="loading-title">AI가 문제와 해설을 출제하고 있습니다...</p>
        <p class="muted">과목과 단원에 맞는 문항을 구성 중입니다. 잠시만 기다려 주세요.</p>
      </div>

      <!-- 생성된 퀴즈 & 풀이 영역 -->
      <section id="quiz-workspace" class="hidden">
        <div class="card quiz-header-card">
          <div class="quiz-meta-row">
            <div>
              <div class="meta-badges" id="quiz-meta-badges"></div>
              <h2 id="quiz-title-display" class="quiz-title"></h2>
            </div>
            <div class="quiz-toolbar">
              <label class="toggle-label">
                <input type="checkbox" id="toggle-preview-answers" />
                <span>정답·해설 미리보기</span>
              </label>
              <button type="button" class="btn btn-secondary" id="btn-save-gallery">
                갤러리에 저장
              </button>
            </div>
          </div>

          <div id="score-banner" class="score-banner hidden"></div>
        </div>

        <div id="questions-container" class="questions-list"></div>

        <div class="quiz-footer-actions">
          <button type="button" class="btn btn-primary" id="btn-submit-quiz">채점하고 해설 보기</button>
          <button type="button" class="btn btn-outline hidden" id="btn-retry-quiz">다시 풀기</button>
        </div>
      </section>
    </section>

    <!-- ==================== 갤러리 탭 ==================== -->
    <section id="view-gallery" class="tab-view hidden">
      <div class="card gallery-header-card">
        <div class="gallery-top">
          <div>
            <h2>퀴즈 갤러리</h2>
            <p class="muted">제작하고 저장한 퀴즈를 다시 풀거나 정답·해설을 확인할 수 있습니다.</p>
          </div>
          <div class="gallery-io-actions">
            <button type="button" class="btn btn-outline btn-sm" id="btn-export-gallery">JSON 내보내기</button>
            <label class="btn btn-outline btn-sm file-upload-btn">
              JSON 가져오기
              <input type="file" id="input-import-gallery" accept=".json,application/json" hidden />
            </label>
          </div>
        </div>

        <div class="gallery-filters">
          <input type="search" id="gallery-search" placeholder="과목, 단원, 제목 검색..." />
          <select id="gallery-type-filter" aria-label="문제 유형 필터">
            <option value="all">모든 유형</option>
            <option value="multiple_choice">객관식</option>
            <option value="short_answer">주관식</option>
          </select>
        </div>
      </div>

      <div id="gallery-empty" class="card empty-state hidden">
        <p class="empty-title">저장된 퀴즈가 아직 없습니다.</p>
        <p class="muted">‘문제 출제’ 메뉴에서 퀴즈를 생성한 뒤 <strong>갤러리에 저장</strong> 버튼을 눌러보세요.</p>
        <button type="button" class="btn btn-primary" id="btn-go-generator">첫 퀴즈 만들러 가기</button>
      </div>

      <div id="gallery-grid" class="gallery-grid"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
